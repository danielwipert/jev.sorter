<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%" role="img" aria-labelledby="t d" style="font-family:system-ui, -apple-system, 'Segoe UI', sans-serif;background:#fcfcfb">
<title id="t">Calibration: accuracy within each confidence band, test set</title>
<desc id="d">For each model, the share of answers that were correct, grouped by the confidence the model reported. The gray line is perfect calibration. Hollow points rest on fewer than 20 messages.</desc>
<rect width="720" height="440" fill="#fcfcfb"/>
<text x="56" y="24" font-size="15" font-weight="600" fill="#0b0b0b">Does a confidence of 90 mean 90% right?</text>
<text x="56" y="44" font-size="12" fill="#52514e">Share of answers correct, by the confidence each model reported. Test set, 1,000 messages per model.</text>
<text x="56" y="61" font-size="12" fill="#52514e">Hollow point = fewer than 20 messages in that band. Hover a point for its numbers.</text>
<line x1="56" y1="86" x2="74" y2="86" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="65" cy="86" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="80" y="90" font-size="12" fill="#0b0b0b">Jev (v2)</text>
<line x1="168" y1="86" x2="186" y2="86" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/>
<circle cx="177" cy="86" r="4" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="192" y="90" font-size="12" fill="#0b0b0b">Sonnet 5</text>
<line x1="280" y1="86" x2="298" y2="86" stroke="#1baf7a" stroke-width="2" stroke-linecap="round"/>
<circle cx="289" cy="86" r="4" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
<text x="304" y="90" font-size="12" fill="#0b0b0b">Haiku 4.5</text>
<line x1="400" y1="86" x2="418" y2="86" stroke="#898781" stroke-width="1"/>
<text x="424" y="90" font-size="12" fill="#52514e">Perfect calibration</text>
<line x1="56" y1="384.0" x2="696" y2="384.0" stroke="#c3c2b7" stroke-width="1"/>
<text x="48" y="388.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">0%</text>
<line x1="56" y1="314.0" x2="696" y2="314.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="48" y="318.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">25%</text>
<line x1="56" y1="244.0" x2="696" y2="244.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="48" y="248.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">50%</text>
<line x1="56" y1="174.0" x2="696" y2="174.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="48" y="178.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">75%</text>
<line x1="56" y1="104.0" x2="696" y2="104.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="48" y="108.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">100%</text>
<text x="109.33333333333334" y="404" font-size="11" fill="#898781" text-anchor="middle">0–49</text>
<text x="216.0" y="404" font-size="11" fill="#898781" text-anchor="middle">50–59</text>
<text x="322.6666666666667" y="404" font-size="11" fill="#898781" text-anchor="middle">60–69</text>
